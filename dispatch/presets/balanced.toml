# balanced: every slot filled by the vendor that is best at that role.
#
# Assumes all three CLIs are installed and logged in: `codex`, `claude`, and
# `grok`. Run `dispatch doctor` to check. Drop the lanes for a vendor you do
# not have, and refill the slots that named them.

[general]
default_lane = "astra@medium"

[lanes.luna]
driver = "codex"
model = "gpt-5.6-luna"
efforts = ["high", "xhigh", "max"]
tier = "priority"
alt_tiers = ["default", "priority"]
tier_aliases = { fast = "priority" }

[lanes.sol]
driver = "codex"
model = "gpt-5.6-sol"
efforts = ["medium", "high", "xhigh", "max"]
tier = "default"
alt_tiers = ["default", "priority"]
tier_aliases = { fast = "priority" }

[lanes.astra]
driver = "codex"
model = "gpt-6-astra"
efforts = ["medium", "high", "xhigh"]
tier = "default"
alt_tiers = ["default", "priority"]
tier_aliases = { fast = "priority" }

[lanes.opus]
driver = "claude"
model = "claude-opus-5"
efforts = ["medium", "high"]

[lanes.fable]
driver = "claude"
model = "claude-fable-5-1"
efforts = ["high"]

[lanes.grok]
driver = "grok"
model = "grok-4.6"
efforts = ["high"]

[board]
light = "luna@high"
medium = "astra@medium"
high = "opus@high"
blindspot = "grok@high"
genius = "fable@high"

# One line per slot, printed by `dispatch board`. This is what an orchestrating
# agent routes by, so write it as a rule rather than as a description.
[board.when]
light = "bulk mechanical work; the only slot a depth-1 worker may spawn"
medium = "the default: a well-scoped task with a clear deliverable"
high = "work meant to be merged, or whose shape outlives the task"
blindspot = "review by a vendor that does not share the others' blind spots"
genius = "the one call worth the highest price; never a volume lane"

# Machines are ssh targets. Uncomment and name your own; a lane may pin one
# with `machine = "..."`, and `--on <name>` overrides it per run.
#
# [machines.workshop]
# ssh = "operator@workshop"
# mode = "dispatch"          # the remote box runs its own dispatch
#
# [machines.spare]
# ssh = "operator@spare"
# mode = "shell"             # no dispatch there; drive its terminal over ssh
