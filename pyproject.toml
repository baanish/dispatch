[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch"
version = "0.1.0.dev0"
description = "Launch, cap, and record AI-agent workers on the vendor CLIs you already have."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dispatch contributors" }]
keywords = ["agents", "cli", "codex", "claude", "grok", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

# The package itself is stdlib only. These are the test runner the suite is run
# with; the cases themselves are stdlib unittest and run under `python3 -m
# unittest` too.
[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3"]

[project.scripts]
dispatch = "dispatch.cli:main"

[tool.setuptools.packages.find]
include = ["dispatch*"]

[tool.setuptools.package-data]
dispatch = ["presets/*.toml", "skill/*.md"]
